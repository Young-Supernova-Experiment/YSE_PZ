<li><a class="yse-facet-link{% if v.active %} active{% endif %}" href="{{ v.url }}" data-yse-facet="{{ facet.key }}" data-yse-facet-value="{{ v.value }}"{% if v.active %} aria-current="true" title="Remove this filter"{% endif %}><span class="yse-facet-check" aria-hidden="true">{% if v.active %}&#10003;{% endif %}</span><span class="yse-facet-label">{{ v.label }}</span>{% if v.active %}<span class="sr-only"> (selected; select to remove)</span>{% endif %}<span class="yse-facet-count badge badge-light">{{ v.count }}</span></a></li>
