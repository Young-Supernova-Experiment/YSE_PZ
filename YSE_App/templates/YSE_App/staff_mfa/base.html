{% load static %}
<!DOCTYPE html>
<html lang="en" data-yse-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>YSE PZ | {% block title %}Two-factor sign-in{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <script>
  (function () {
    try {
      var t = localStorage.getItem("yse-theme") || "dark";
      var dark = t !== "light";
      document.documentElement.setAttribute("data-yse-theme", dark ? "dark" : "light");
      document.documentElement.classList.toggle("dark-mode", dark);
    } catch (e) {
      document.documentElement.setAttribute("data-yse-theme", "dark");
    }
  })();
  </script>
  <link rel="shortcut icon" type="image/png" href="{% static 'YSE_App/favicon.ico' %}"/>
  <link rel="stylesheet" href="{% static 'YSE_App/vendor/bootstrap-4.6/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'YSE_App/yse-theme.css' %}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    .yse-mfa-qr svg { display: block; margin: 0 auto; max-width: 100%; height: auto; background: #fff; }
    .yse-mfa-secret { font-family: monospace; letter-spacing: 0.05em; word-break: break-all; }
    .yse-mfa-codes { font-family: monospace; font-size: 1.1em; columns: 2; list-style: none; padding-left: 0; }
  </style>
</head>
<body class="yse-login yse-theme">
<div class="yse-login-box">
  <div class="yse-login-logo"><b>YSE</b>PZ</div>
  {% block content %}{% endblock %}
  <form action="{% url 'auth_logout' %}" method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-link p-0">Sign out</button>
  </form>
</div>
<script src="{% static 'YSE_App/yse-chrome.js' %}"></script>
</body>
</html>
