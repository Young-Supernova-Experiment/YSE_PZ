{% load render_table from django_tables2 %}
<div class="box-body yse-favorites-section" data-count="{{ count }}">
  {% if count %}
  {% render_table table %}
  {% else %}
  <p class="text-muted mb-0 yse-favorites-empty">No favorites yet: star a transient with the <i class="fa fa-star-o"></i> next to its name, or in the Fav. column of any table.</p>
  {% endif %}
</div>
