{% load static %}
<!DOCTYPE html>
<html lang="en" data-yse-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>YSE PZ | Sign up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    // An explicit choice ("yse-theme-choice", set only by the toggle) wins; otherwise
    // follow the OS setting (#821). The old "yse-theme" key was written on every page
    // load, so only a legacy "light" counts as a choice (it is copied to the new key).
    var t = null;
    try {
      t = localStorage.getItem("yse-theme-choice");
      if (t !== "light" && t !== "dark") {
        t = null;
        if (localStorage.getItem("yse-theme") === "light") {
          t = "light";
          localStorage.setItem("yse-theme-choice", "light");
        }
      }
    } catch (e) {}
    if (!t) {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    var dark = t !== "light";
    document.documentElement.setAttribute("data-yse-theme", dark ? "dark" : "light");
    document.documentElement.classList.toggle("dark-mode", dark);
  })();
  </script>
  <link rel="shortcut icon" type="image/png" href="{% static 'YSE_App/favicon.ico' %}"/>
  <link rel="stylesheet" href="{% static 'YSE_App/vendor/bootstrap-4.6/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'YSE_App/yse-theme.css' %}?v=chrome-nav-1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="yse-login yse-theme">
<div class="yse-login-box">
  <div class="yse-login-logo">
    <a href="{% url 'auth_login' %}"><b>YSE</b>PZ</a>
  </div>
  <p>Thank you. {% if verification %}If the details were valid, check your email for a link to confirm your address.{% endif %}</p>
  <p class="mb-0 small"><a href="{% url 'auth_login' %}">Sign in</a></p>
</div>
<script src="{% static 'YSE_App/yse-chrome.js' %}?v=chrome-nav-1"></script>
</body>
</html>
