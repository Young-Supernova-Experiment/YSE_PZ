{# Drives the facility form and list; both must sit inside #facility_request_box (#300, #857). #}
<script>
(function() {
	var $box = $('#facility_request_box');
	if (!$box.length) { return; }
	var csrftoken = (document.cookie.match(new RegExp('(?:^|;\\s*)' + '{{ csrf_cookie_name|default:'csrftoken'|escapejs }}' + '=([^;]+)')) || [])[1] || $box.find('input[name=csrfmiddlewaretoken]').val();
	var actionUrlTemplate = "{% url 'facility_request_action' 0 %}";

	function fieldHtml(f, prefix) {
		var id = (prefix || 'fr_') + f.name, value = f.default === null || f.default === undefined ? '' : f.default;
		var req = f.required ? ' required' : '';
		var html = '<div class="col-md-4 col-sm-6 col-12"><div class="form-group"><label for="' + id + '">' + $('<span>').text(f.label).html() + (f.required ? ' *' : '') + '</label>';
		if (f.type === 'choice') {
			html += '<select class="form-control facility-param" id="' + id + '" data-name="' + f.name + '" data-type="' + f.type + '">';
			(f.choices || []).forEach(function(c) { html += '<option value="' + $('<span>').text(c[0]).html() + '"' + (String(c[0]) === String(value) ? ' selected' : '') + '>' + $('<span>').text(c[1]).html() + '</option>'; });
			html += '</select>';
		} else if (f.type === 'boolean') {
			html += '<select class="form-control facility-param" id="' + id + '" data-name="' + f.name + '" data-type="' + f.type + '"><option value="false"' + (!value ? ' selected' : '') + '>no</option><option value="true"' + (value ? ' selected' : '') + '>yes</option></select>';
		} else {
			var t = (f.type === 'number' || f.type === 'integer') ? 'number' : (f.type === 'datetime' ? 'datetime-local' : 'text');
			if (f.type === 'list' && Array.isArray(value)) { value = value.join(','); }
			if (f.type === 'datetime' && value) { value = String(value).slice(0, 16); }
			html += '<input class="form-control facility-param" type="' + t + '" id="' + id + '" data-name="' + f.name + '" data-type="' + f.type + '" value="' + $('<span>').text(value).html() + '"' + (t === 'number' ? ' step="any"' : '') + req + '>';
		}
		if (f.help) { html += '<small class="form-text text-muted">' + $('<span>').text(f.help).html() + '</small>'; }
		return html + '</div></div>';
	}
	function renderFields() {
		var $opt = $('#facility_allocation option:selected');
		var schema = [];
		try { schema = JSON.parse($opt.attr('data-schema') || '[]'); } catch (e) { schema = []; }
		$('#facility_fields').html(schema.map(fieldHtml).join(''));
	}
	function collectParams(container) {
		var params = {};
		$(container || '#facility_fields').find('.facility-param').each(function() {
			var $el = $(this), name = $el.data('name'), type = $el.data('type'), v = $el.val();
			if (v === '' || v === null) { return; }
			if (type === 'number' || type === 'integer') { v = Number(v); }
			else if (type === 'boolean') { v = (v === 'true'); }
			else if (type === 'list') { v = String(v).split(',').map(function(s) { return s.trim(); }).filter(Boolean); }
			params[name] = v;
		});
		return params;
	}
	function reloadRequests() {
		var $slot = $('#facility_requests_slot');
		$.get($slot.data('url')).done(function(html) { $slot.html(html); });
	}
	function showError(msg) {
		var $e = $('#facility_request_error');
		if (msg) { $e.text(msg).removeAttr('hidden'); } else { $e.text('').attr('hidden', 'hidden'); }
	}
	$box.on('change', '#facility_allocation', renderFields);
	$box.on('submit', '#facility_request_form', function(e) {
		e.preventDefault();
		showError('');
		var $btn = $('#facility_submit_btn').prop('disabled', true);
		$.ajax({
			url: this.action, method: 'POST', contentType: 'application/json', headers: { 'X-CSRFToken': csrftoken },
			data: JSON.stringify({ allocation: $('#facility_allocation').val(), parameters: collectParams() })
		}).done(function(data) {
			reloadRequests();
		}).fail(function(xhr) {
			var data = xhr.responseJSON || {};
			var msg = data.error || ('Request failed (' + xhr.status + ')');
			if (data.errors) { msg = Object.keys(data.errors).map(function(k) { return k + ': ' + data.errors[k]; }).join('; '); }
			showError(msg);
		}).always(function() { $btn.prop('disabled', false); });
	});
	$box.on('click', '[data-fr-log]', function() {
		// the log travels with the row (data-log); the table is reloaded after every action
		var id = $(this).data('fr-log'), entries = [];
		try { entries = JSON.parse($(this).closest('tr').attr('data-log') || '[]'); } catch (e) { entries = []; }
		$('#facility_log_id').text('#' + id);
		$('#facility_log_entries').html(entries.length ? entries.map(function(e) {
			return '<li><code>' + $('<span>').text((e.at || '').slice(0, 19).replace('T', ' ')).html() + '</code> <b>' + $('<span>').text(e.event).html() + '</b> ' + $('<span>').text(e.detail || '').html() + '</li>';
		}).join('') : '<li class="text-muted">no entries</li>');
		$('#facility_log_panel').removeAttr('hidden');
	});
	$box.on('click', '#facility_log_close', function() { $('#facility_log_panel').attr('hidden', 'hidden'); });
	$box.on('click', '[data-fr-modify]', function() {
		var $row = $(this).closest('tr'), id = $(this).data('fr-modify');
		var schema = [], payload = {};
		try { schema = JSON.parse($row.attr('data-schema') || '[]'); payload = JSON.parse($row.attr('data-payload') || '{}'); } catch (e) {}
		schema.forEach(function(f) { if (payload[f.name] !== undefined) { f.default = payload[f.name]; } });
		$('#facility_modify_id').text('#' + id).data('request-id', id);
		$('#facility_modify_fields').html(schema.map(function(f) { return fieldHtml(f, 'frm_'); }).join(''));
		$('#facility_modify_error').text('').attr('hidden', 'hidden');
		$('#facility_modify_panel').removeAttr('hidden');
	});
	$box.on('click', '#facility_modify_close', function() { $('#facility_modify_panel').attr('hidden', 'hidden'); });
	$box.on('click', '#facility_modify_send', function() {
		var id = $('#facility_modify_id').data('request-id'), $b = $(this).prop('disabled', true);
		$.ajax({
			url: actionUrlTemplate.replace('/0/', '/' + id + '/'), method: 'POST', contentType: 'application/json',
			headers: { 'X-CSRFToken': csrftoken }, data: JSON.stringify({ action: 'update', parameters: collectParams('#facility_modify_fields') })
		}).done(function() { $('#facility_modify_panel').attr('hidden', 'hidden'); reloadRequests(); }).fail(function(xhr) {
			var data = xhr.responseJSON || {}, msg = data.error || ('Modification failed (' + xhr.status + ')');
			if (data.errors) { msg = Object.keys(data.errors).map(function(k) { return k + ': ' + data.errors[k]; }).join('; '); }
			$('#facility_modify_error').text(msg).removeAttr('hidden');
		}).always(function() { $b.prop('disabled', false); });
	});
	$box.on('click', '[data-fr-action]', function() {
		var $b = $(this), id = $b.closest('tr').data('request-id'), action = $b.data('fr-action');
		if (action === 'cancel' && !window.confirm('Cancel this facility request?')) { return; }
		$b.prop('disabled', true);
		$.ajax({
			url: actionUrlTemplate.replace('/0/', '/' + id + '/'), method: 'POST', contentType: 'application/json',
			headers: { 'X-CSRFToken': csrftoken }, data: JSON.stringify({ action: action })
		}).done(reloadRequests).fail(function(xhr) {
			var data = xhr.responseJSON || {};
			window.alert(data.error || ('Action failed (' + xhr.status + ')'));
			$b.prop('disabled', false);
		});
	});
	renderFields();
})();
</script>
