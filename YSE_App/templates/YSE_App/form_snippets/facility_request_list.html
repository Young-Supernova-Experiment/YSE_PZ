{# Facility requests list with its modify and log panels (#300); included by facility_request_form.html and the preview follow-up tab (#857). #}
		<div id="facility_requests_slot" class="mt-3" data-url="{% url 'transient_facility_requests_fragment' transient.id %}">
			{% include "YSE_App/transient_detail_facility_requests.html" %}
		</div>
		<div class="mt-2" id="facility_modify_panel" hidden>
			<h5 class="mb-1">Modify request <span id="facility_modify_id"></span></h5>
			<div class="row" id="facility_modify_fields"></div>
			<div class="text-danger small" id="facility_modify_error" hidden></div>
			<button type="button" class="btn btn-sm btn-primary" id="facility_modify_send">Send modification</button>
			<button type="button" class="btn btn-sm btn-default" id="facility_modify_close">Close</button>
		</div>
		<div class="mt-2" id="facility_log_panel" hidden>
			<h5 class="mb-1">Request log <span id="facility_log_id"></span> <button type="button" class="btn btn-xs btn-default" id="facility_log_close">Close</button></h5>
			<ul class="list-unstyled small mb-0" id="facility_log_entries"></ul>
		</div>
