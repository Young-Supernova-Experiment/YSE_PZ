<form method="post" action="{% url 'ui_preview_switch' %}" class="m-0" id="yse-ui-preview-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="on" value="{% if ui_preview %}0{% else %}1{% endif %}"><button type="submit" class="dropdown-item">{% if ui_preview %}Back to the current layout{% else %}Try the new layout (preview){% endif %}</button></form>
