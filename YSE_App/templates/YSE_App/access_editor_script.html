<script>
// Preview layout (#863): one editor for every row of the access tables. "Edit" copies the row's forms
// (a <template>) into the modal; the forms post exactly what the current layout's per-row forms post.
(function () {
	var modal = document.getElementById("yse-access-editor");
	if (!modal) {
		return;
	}
	document.body.appendChild(modal);  // above the page layout, so the backdrop never covers it
	var body =document.getElementById("yse-access-editor-body");
	var title = document.getElementById("yse-access-editor-title");
	document.addEventListener("click", function (event) {
		var button = event.target.closest ? event.target.closest(".yse-access-edit") : null;
		if (!button) {
			return;
		}
		var source = document.getElementById(button.getAttribute("data-editor"));
		if (!source || !source.content) {
			return;
		}
		event.preventDefault();
		body.innerHTML = "";
		body.appendChild(document.importNode(source.content, true));
		title.textContent = button.getAttribute("data-title") || "Edit";
		window.jQuery(modal).modal("show");
	});
	window.jQuery(modal).on("shown.bs.modal", function () {
		var first = body.querySelector("select, input:not([type=hidden]), button");
		if (first) {
			first.focus();
		}
	}).on("hidden.bs.modal", function () {
		body.innerHTML = "";
	});
})();
</script>
