{% comment %}Preview layout (#863) of access_grantee_fields.html for the row editor: the same fields (effect,
grantee_kind, group, username) with visible labels. Context: groups, prefix and suffix (a unique id prefix).{% endcomment %}
<div class="form-row">
	<div class="form-group col-sm-6">
		<label class="small mb-0" for="{{ prefix }}{{ suffix }}-effect">Effect</label>
		<select name="effect" id="{{ prefix }}{{ suffix }}-effect" class="form-control form-control-sm">
			<option value="allow">Allow</option>
			<option value="deny">Restrict</option>
		</select>
	</div>
	<div class="form-group col-sm-6">
		<label class="small mb-0" for="{{ prefix }}{{ suffix }}-kind">Grantee</label>
		<select name="grantee_kind" id="{{ prefix }}{{ suffix }}-kind" class="form-control form-control-sm">
			<option value="group">Group</option>
			<option value="user">One person</option>
		</select>
	</div>
	<div class="form-group col-sm-6">
		<label class="small mb-0" for="{{ prefix }}{{ suffix }}-group">Group</label>
		<select name="group" id="{{ prefix }}{{ suffix }}-group" class="form-control form-control-sm">
			<option value="">(group)</option>
			{% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
		</select>
	</div>
	<div class="form-group col-sm-6">
		<label class="small mb-0" for="{{ prefix }}{{ suffix }}-user">Username</label>
		<input type="text" name="username" id="{{ prefix }}{{ suffix }}-user" class="form-control form-control-sm" placeholder="or username" maxlength="150">
	</div>
</div>
