{% load static %}
<!DOCTYPE html>
<html lang="en" data-yse-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>YSE PZ | Log in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var t = localStorage.getItem("yse-theme") || "dark";
      var dark = t !== "light";
      document.documentElement.setAttribute("data-yse-theme", dark ? "dark" : "light");
      document.documentElement.classList.toggle("dark-mode", dark);
    } catch (e) {
      document.documentElement.setAttribute("data-yse-theme", "dark");
    }
  })();
  </script>
  <link rel="shortcut icon" type="image/png" href="{% static 'YSE_App/favicon.ico' %}"/>
  <link rel="stylesheet" href="{% static 'YSE_App/vendor/bootstrap-4.6/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'YSE_App/yse-theme.css' %}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="yse-login yse-theme">
<div class="yse-login-box">
  <div class="yse-login-logo">
    <a href="{% url 'dashboard' %}"><b>YSE</b>PZ</a>
  </div>
  <p>Sign in to start your session</p>
  <form action="{% url 'auth_login' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}" />
    <div class="form-group">
      <label for="id_username">Username</label>
      <input id="id_username" name="username" class="form-control" type="text" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" class="form-control" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>
</div>
<script src="{% static 'YSE_App/yse-chrome.js' %}"></script>
</body>
</html>
