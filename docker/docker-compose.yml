services:
    web:
        container_name: ysepz_web_container
        image: "ghcr.io/young-supernova-experiment/yse_pz:latest"
        platform: linux/amd64
        working_dir: /app
        volumes:
            - ${VOL}:/app
            - ./entrypoints:/app/Entrypoints
        links:
            - yse_db
        command: bash ./Entrypoints/docker-compose-up-entrypoint.sh
        ports:
        - "127.0.0.1:8000:8000"
        environment:
          CONDA_DEFAULT_ENV: base
          PROJ_LIB: /opt/conda/share/proj
          CONDA_PREFIX: /opt/conda
          DB_CONFIG: /opt/project/db_configuration
        env_file:
          - ".env"
          - ".env.secrets"
        depends_on:
          yse_db:
            condition: service_healthy
    # Broker stream consumer (#278, docs/broker-streams.md). Opt-in: only starts with
    # `docker compose --profile brokers up`; BROKER_CONNECTION names the enabled
    # BrokerConnection slug (admin > Broker connections).
    yse_broker_ingest:
        container_name: ysepz_broker_ingest_container
        image: "ghcr.io/young-supernova-experiment/yse_pz:latest"
        platform: linux/amd64
        working_dir: /app
        profiles: ["brokers"]
        volumes:
            - ${VOL}:/app
        command: python manage.py broker_ingest --connection ${BROKER_CONNECTION:-fink} --workers ${BROKER_WORKERS:-2}
        environment:
          CONDA_DEFAULT_ENV: base
          PROJ_LIB: /opt/conda/share/proj
          CONDA_PREFIX: /opt/conda
          DB_CONFIG: /opt/project/db_configuration
        env_file:
          - ".env"
          - ".env.secrets"
        restart: unless-stopped
        depends_on:
          yse_db:
            condition: service_healthy
    yse_redis:
      container_name: ysepz_redis_container
      image: redis:7.4.11-alpine
      platform: linux/amd64
      # Password comes from REDIS_PASSWORD in docker/.env (compose substitutes it);
      # refuse to start without one. Going through docker-entrypoint.sh keeps the
      # official image's drop to the unprivileged redis user.
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      command:
        - sh
        - -c
        - 'test -n "$$REDIS_PASSWORD" || { echo "REDIS_PASSWORD is not set in docker/.env" >&2; exit 1; }; exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"'
      ports:
        - "127.0.0.1:6379:6379"
    yse_db:
      container_name: ysepz_db_container
      image: "mysql:8.0.46"
      platform: linux/amd64
      command: mysqld --default-authentication-plugin=mysql_native_password
      ports:
        - "127.0.0.1:${LOCAL_DB_PORT}:3306"
      volumes:
        - ${VOL_DB}:/var/lib/mysql
        - ./db_init/db_configuration:/etc/mysql/conf.d
        - ./db_init/init.sql:/docker-entrypoint-initdb.d/1.sql
        - ./db_init/YSE_Initial_Schema.sql:/docker-entrypoint-initdb.d/2.sql
        - ./db_init/YSE_followupstatus_insert.sql:/docker-entrypoint-initdb.d/3.sql
        - ./db_init/YSE_rest_of_tables_insert.sql:/docker-entrypoint-initdb.d/4.sql
        - ./db_init/YSE_django_migrations_insert.sql:/docker-entrypoint-initdb.d/5.sql
        - ./db_init/YSE_create_users.sh:/docker-entrypoint-initdb.d/6.sh
        - ${VOL_GHOST}:/app/ghost_logs
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PWD}
        YSE_DATABASE_PASSWORD: ${YSE_DATABASE_PASSWORD:?set YSE_DATABASE_PASSWORD in docker/.env}
        YSE_EXPLORER_PASSWORD: ${YSE_EXPLORER_PASSWORD:?set YSE_EXPLORER_PASSWORD in docker/.env}
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
        interval: 5s
        timeout: 20s
        retries: 10
        start_period: 60s
    yse_nginx:
      container_name: ysepz_web_nginx_container
      image: "nginx:1.30.5-alpine"
      ports:
        - "127.0.0.1:${LOCAL_HTTP_PORT}:80"
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        - ${STATIC_VOL}:/static
      depends_on:
        - web

