[database]
DATABASE_NAME: YSE
#<Django system user pwd. To request this USR, please contact owner of repo>
DATABASE_USER: dev
#<Django system user pwd. To request this PWD, please contact owner of repo>
DATABASE_PASSWORD: devpass
# This host, `yse_db`, is necessary for Docker Compose to create the container network
DATABASE_HOST: yse_db
# This port, `3306`, is used WITHIN the containers and is necessary
DATABASE_PORT: 3306
#<Name of SQL Explorer system user. To request this USR, please contact owner of repo>
EXPLORER_USER: dev_explorer
#<SQL Explorer system user pwd. To request this PWD, please contact owner of repo>
EXPLORER_PASSWORD: dev_explorerpass
# Optional: set False to let the default MySQL connection negotiate TLS (default True)
SSL_DISABLED: True

[virtual_directory]
#<Use this to define your login page relative URL path, if using virtual directory. Default: `/login/`>
LOGIN_URL = /login/

[SMTP_provider]
SMTP_LOGIN: <For SMTP emails, a system login name>
SMTP_PASSWORD: <For SMTP emails, a system login pwd>
SMTP_HOST: <Host for SMTP service. Ex: `smtp.gmail.com`>
SMTP_PORT: <Port for SMTP service. For Gmail, ex: `587`>
# Optional (notification emails via django.core.mail): FROM_ADDRESS defaults to
# SMTP_LOGIN (@gmail.com appended when it has no @); SMTP_USE_TLS default True;
# EMAIL_BACKEND default django.core.mail.backends.smtp.EmailBackend
# FROM_ADDRESS: yse-pz@example.org
# SMTP_USE_TLS: True

[YSE_SMTP_provider]
SMTP_LOGIN: <For YSE SMTP emails, a system login name>
SMTP_PASSWORD: <For YSE SMTP emails, a system login pwd>
SMTP_HOST: <Host for YSE SMTP service. Ex: `smtp.gmail.com`>
SMTP_PORT: <Port for YSE SMTP service. For Gmail, ex: `587`>

[site_settings]
STATIC: /static/
IS_DEBUG: True
# SECRET_KEY: required when IS_DEBUG is False (or set DJANGO_SECRET_KEY in the env).
# The <...> placeholder counts as unset; with IS_DEBUG True a fixed dev key is used.
SECRET_KEY: <django secret key; leave placeholder if using env>
# Optional: comma-separated hosts this stack answers for (or DJANGO_ALLOWED_HOSTS env).
# Unset means every host is accepted, as before. Example for Ziggy:
# ALLOWED_HOSTS: ziggy.ucolick.org,localhost,127.0.0.1
# Optional: time cap in ms for statements on the explorer DB connection (saved
# dashboard SQL on a cache miss, SQL Explorer UI). MySQL only. Default 0 = no cap.
# Do not enable until the saved dashboard queries are rewritten (#233): today they
# run for minutes on production data and a cap would fail every section.
# Recommended once they are fast: 20000.
EXPLORER_QUERY_MAX_EXECUTION_MS: 0
# Optional: seconds a saved query's cached dashboard result is reused; default 3600
EXPLORER_QUERY_CACHE_SECONDS: 3600
# Optional: re-run every dashboard saved query from cron so browsers never hit a
# cold cache (django_cron WarmDashboardQueries; runs with the time cap off).
# Default False; DASHBOARD_CACHE_WARM_MINUTES is the interval (default 60).
DASHBOARD_CACHE_WARM_ENABLED: False
DASHBOARD_CACHE_WARM_MINUTES: 60
# Optional: where `manage.py rewrite_dashboard_queries --apply` writes the JSON
# backup of the SQL it replaces; default <repo>/backups/saved_queries
# DASHBOARD_QUERY_BACKUP_DIR: /data/yse_pz/backups/saved_queries
# Optional: days of django_cron run logs (CronJobLog rows) to keep; default 30
CRON_LOG_RETENTION_DAYS: 30
# Background job queue (docs/background-jobs.md). All optional.
# The RunQueuedJobs cron drains the queue from `manage.py runcrons`; set False once
# a `manage.py run_jobs --loop` worker (systemd) owns the queue.
JOB_RUNNER_CRON_ENABLED: True
JOB_RUNNER_CRON_MINUTES: 1
JOB_RUNNER_CRON_BUDGET_SECONDS: 50
JOB_RUNNER_MAX_ATTEMPTS: 3
JOB_RUNNER_BACKOFF_SECONDS: 60
JOB_RUNNER_BACKOFF_MAX_SECONDS: 3600
JOB_RUNNER_STALE_MINUTES: 60
JOB_RUNNER_PASS_LIMIT: 100
# Run jobs synchronously inside enqueue() (development only)
JOB_RUNNER_INLINE: False
# Facility APIs (#298, docs/facility-apis.md): extra adapter modules and the HTTP timeout
FACILITY_API_MODULES:
FACILITY_HTTP_TIMEOUT_SECONDS: 30
# Analysis services (#312): webhook timeout, per-file size cap (bytes), files per run
ANALYSIS_HTTP_TIMEOUT_SECONDS: 30
ANALYSIS_MAX_ATTACHMENT_BYTES: 26214400
ANALYSIS_MAX_FILES_PER_RUN: 20
# NGSF spectral classification (docs/ngsf.md): how to run an installed NGSF (program on PATH or a
# full command; "{params}" marks where the parameters.json path goes), its directory (template bank
# + base parameters.json) and the per-run subprocess timeout. Leave NGSF_COMMAND empty when NGSF is
# not installed: the Summary tab then says so.
NGSF_COMMAND: ngsf
NGSF_HOME:
NGSF_SUBPROCESS_TIMEOUT: 1500
# Annotations (#316, docs/annotations.md): catalogue checks (Gaia DR3, WISE, quasar)
ANNOTATION_HTTP_TIMEOUT_SECONDS: 30
ANNOTATION_SEARCH_RADIUS_ARCSEC: 3.0
ANNOTATION_RUN_STALE_MINUTES: 60
# Checks queued for every new transient, comma-separated slugs (e.g. gaia_dr3,wise,quasar); empty = off
ANNOTATION_AUTORUN_SERVICES:
# TAP endpoints (defaults: ESA Gaia archive, CDS VizieR)
# GAIA_TAP_URL: https://gea.esac.esa.int/tap-server/tap/sync
# VIZIER_TAP_URL: https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync
# Extra modules whose import registers @job handlers, comma-separated
# JOB_HANDLER_MODULES: mypkg.jobs
# Notification delivery (in-app rows are always written).
# Email uses [SMTP_provider]; off until that block holds real credentials.
NOTIFICATION_EMAIL_ENABLED: False
NOTIFICATION_SLACK_ENABLED: True
NOTIFICATION_EMAIL_SUBJECT_PREFIX: [YSE-PZ]
# Absolute link prefix for emails/Slack (default: YSE_PUBLIC_BASE_URL)
# NOTIFICATION_BASE_URL: https://ziggy.ucolick.org/yse/
NOTIFICATION_LIST_PAGE_SIZE: 50

[secrets]
# Fernet key that encrypts EncryptedCredential rows (per-resource facility, broker
# and TNS secrets) at rest. Required when IS_DEBUG is False; with IS_DEBUG True a key
# derived from SECRET_KEY is used. Generate: python manage.py generate_credentials_key
# A comma-separated list is accepted: the first key encrypts, all of them decrypt
# (use during a rotation; see docs/credentials-and-external-services.md).
credentials_key: <fernet key from `manage.py generate_credentials_key`; leave placeholder if using env>

[secrets_env]
# These can be set as environment variables instead of storing in this file:
#   DJANGO_SECRET_KEY  — Django SECRET_KEY
#   YSE_CREDENTIALS_KEY — Fernet key for EncryptedCredential (overrides [secrets] credentials_key)
#   DJANGO_ALLOWED_HOSTS — comma-separated ALLOWED_HOSTS (overrides ALLOWED_HOSTS above)
#   YSE_EXPLORER_MAX_EXECUTION_MS — overrides EXPLORER_QUERY_MAX_EXECUTION_MS above
#   YSE_EXPLORER_QUERY_CACHE_SECONDS — overrides EXPLORER_QUERY_CACHE_SECONDS above
#   YSE_DASHBOARD_CACHE_WARM=1 — overrides DASHBOARD_CACHE_WARM_ENABLED above
#   REDIS_URL — shared result cache for all web processes (see docs/dashboard-performance.md)
#   YSE_JOB_RUNNER_CRON=0 — disable the RunQueuedJobs cron (a run_jobs --loop worker owns the queue)
#   YSE_JOB_RUNNER_INLINE=1 — run jobs synchronously in enqueue() (development)
#   YSE_NOTIFICATION_EMAIL=1 — overrides NOTIFICATION_EMAIL_ENABLED above
#   YSE_EMAIL_BACKEND — Django EMAIL_BACKEND for notification emails
#   TNS_API_KEY        — TNS secret API key (overrides tnsapikey below; not the tns_marker User-Agent)
#   TNS_MARKER_TYPE    — "user" or "bot" for tns_marker User-Agent (overrides tns_marker_type below)
#   TNS_DECAM_API_KEY  — DECam TNS bot key (overrides tnsdecamapikey below)

[main]
login=<For CRON jobs, a Gmail account. Leave blank if not using>
password=<For CRON jobs, a Gmail account. Leave blank if not using>
dburl=http://127.0.0.1:8000/api/
transientapi=transients/
hostapi=hosts/
photometryapi=transientphotometry/
photdataapi=transientphotdata/
hostphotometryapi=hostphotometry/
hostphotdataapi=hostphotdata/
obs_groupapi=observationgroups/
statusapi=transientstatuses/
instrumentapi=instruments/
bandapi=photometricbands/
observatoryapi=observatories/
telescopeapi=telescopes/
transientclassesapi=transientclasses/
internalsurveyapi=internalsurveys/
dblogin=<if using TNS bot to aggregate data, bot login name.>
dbpassword=<pwd/token for the above service>
dbemail=<email address for the above service>
dbemailpassword=<pwd/token for the above email account>
hostmatchrad=0.00083
tnsapi=https://www.wis-tns.org/api/get
tnsapikey=<If using TNS API, the key>
tnsdecamapikey=<If using TNS DECam API key>
tns_bot_id=<TNS user/bot id from tns_marker, e.g. 151>
tns_bot_name=<TNS user/bot name from tns_marker, e.g. rfoley>
tns_marker_type=<user or bot; default bot if omitted>
tns_decam_bot_id=<DECam bot ID, if using>
tns_decam_bot_name=<DECam bot name, if using>
tns_recent_ndays=5
tns_fastupdates_nminutes=10
lcogtuser=<LCOGT user account name, if using>
lcogtpass=<LCOGT user account pwd, if using>
ghost_path=<Path to save GHOST's files. If using Docker, use: `/app/ghost_logs` because it's set in the image>

[antares]
antaresapikey=<If using ANTARES integration, API key>
antaresapisecret=<If using ANTARES integration, API secret>
antaresapi=http://antares.noao.edu/api
# Optional: Rubin/LSST photometry refresh (Query_LSST.AntaresLSST). Every key
# has the default shown; the cron runs with no [antares] lsst_* keys at all.
# ANTARES `ant_survey` value that marks an LSST alert (1/2 are ZTF)
lsst_survey_id=4
# cone-search radius around each YSE transient, arcsec
lsst_cone_radius_arcsec=2.0
# poll transients created/discovered/modified within this many days ...
lsst_max_days=30
# ... that are in one of these statuses (plus any with an open followup window)
lsst_statuses=New,Following,Watch,FollowupRequested,Interesting
# at most this many transients per run, most recently modified first
lsst_max_transients=500
# skip transients north of this declination (deg); Rubin's northern limit
lsst_max_dec=32.0
# two points in the same band closer than this (days) are the same visit
lsst_mjd_match_min=0.0005
# 0 disables; points with lsst_diaSource_reliability below this get the Bad flag
lsst_min_reliability=0.0
# fetch per-alert pixel/negative/reliability flags (one extra API call per locus)
lsst_use_alert_flags=True

