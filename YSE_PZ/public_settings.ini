[brokers]
# Alert-broker plugins and the polling ingest to candidates (docs/brokers.md).
# Every key is optional; the section may be absent.
# Comma-separated provider slugs to offer (empty = all shipped: antares, fink, alerce).
#enabled = antares, fink, alerce
# Enqueue one brokers.ingest job per broker with enabled BrokerFilters from
# `manage.py runcrons` (BrokerPoll cron). Off by default.
#INGEST_CRON_ENABLED = False
#INGEST_CRON_MINUTES = 60
#HTTP_TIMEOUT_SECONDS = 30
# Lasair REST API (token in an EncryptedCredential with service=lasair).
#LASAIR_API_URL = https://lasair-ztf.lsst.ac.uk/api
# Stream consumers (manage.py broker_ingest, docs/broker-streams.md): batch size and the
# heartbeat age after which the dashboard warns that a worker is stale.
#STREAM_BATCH_SIZE = 100
#STREAM_STALE_MINUTES = 15
# Cone-search radius of the transient-detail Brokers tab, arcsec.
#DETAIL_RADIUS_ARCSEC = 5
# A candidate within this many arcsec of an existing transient is linked to it.
#MATCH_RADIUS_ARCSEC = 2.0
# User that auto-saved transients are stamped with (falls back to any superuser).
#AUTO_SAVE_USERNAME = admin
#CANDIDATES_PAGE_SIZE = 50
# Override the public REST endpoints (mirrors, tests).
#FINK_API_URL = https://api.fink-portal.org/api/v1
#ALERCE_API_URL = https://api.alerce.online/ztf/v1
[feeds]
