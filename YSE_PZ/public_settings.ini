#GCN_KAFKA_DOMAIN = gcn.nasa.gov
#SCOUT_API_URL = https://ssd-api.jpl.nasa.gov/scout.api
#SBIDENT_API_URL = https://ssd-api.jpl.nasa.gov/sb_ident.api
# Minor-planet screening of new transients against JPL sb_ident (annotation origin minor_planet).
#MPC_SCREEN_ON_CREATE = False
#MPC_SCREEN_CRON_ENABLED = False
#MPC_SCREEN_CRON_MINUTES = 360
#MPC_SCREEN_RADIUS_ARCSEC = 5.0
#MPC_SCREEN_SINCE_DAYS = 3
#MPC_SCREEN_MAX_PER_RUN = 50
#MPC_SCREEN_OBS_CODE = 500

[sharing]
# Sharing services (#324, docs/tns-sharing.md). Bot credentials live in EncryptedCredential rows
# (admin > Encrypted credentials), not here. Every key is optional; these are the defaults.
# TNS_API_URL: https://www.wis-tns.org/api
# TNS_SANDBOX_API_URL: https://sandbox.wis-tns.org/api
# TNS_HTTP_TIMEOUT_SECONDS: 60
# New services start in sandbox mode (per-service "testing" flag)
DEFAULT_TESTING: True
# Rename a transient to its TNS designation when a discovery report is accepted
RENAME_ON_ACCEPT: True
POLL_DELAY_SECONDS: 10
POLL_MAX_ATTEMPTS: 12
# Evaluate auto-publisher rules on transient saves; the hourly sweep is off until enabled
AUTOPUBLISH_ON_SAVE: True
AUTOPUBLISH_CRON_ENABLED: False
AUTOPUBLISH_CRON_MINUTES: 60
# Hourly TNS retrieval (match internally named transients to TNS by cone search); off until enabled
TNS_RETRIEVAL_CRON_ENABLED: False
TNS_RETRIEVAL_CRON_MINUTES: 60
# Slug of the SharingService whose bot searches TNS (default: any enabled TNS service with a credential)
# TNS_RETRIEVAL_SERVICE: yse-tns
TNS_RETRIEVAL_SINCE_DAYS: 30
TNS_RETRIEVAL_STATUSES: New,Watch,Following,FollowupRequested,Interesting
TNS_RETRIEVAL_RADIUS_ARCSEC: 3.0
TNS_RETRIEVAL_MAX_PER_RUN: 50
TNS_REQUEST_INTERVAL_SECONDS: 1.0

[llm]
# AI summaries (#294, docs/ai-summaries.md). Every key is optional; these are the defaults.
# Provider: template (deterministic summary from the stored data; no key, no network),
# openai (any OpenAI-compatible /chat/completions server) or anthropic (Messages API).
LLM_PROVIDER: template
# Model for openai (required there) or anthropic (default claude-opus-5-5; claude-sonnet-5-5 is
# the cheaper option, claude-fable-5-1 the most capable). Per-service overrides go in the
# ai_summary ExternalService default_params (provider, model, api_base, max_tokens).
# LLM_MODEL:
# LLM_ANTHROPIC_DEFAULT_MODEL: claude-opus-5-5
# Endpoint base (defaults: https://api.openai.com/v1, https://api.anthropic.com)
# LLM_API_BASE:
# The API key is NOT stored here: create an Encrypted credential (admin) with an api_key entry
# and attach it to the ai_summary service, or give it this name / service slug.
LLM_CREDENTIAL: llm
LLM_MAX_TOKENS: 600
# Sampling temperature for openai (blank = the server default; never sent to anthropic)
# LLM_TEMPERATURE:
LLM_HTTP_TIMEOUT_SECONDS: 60
# Embeddings for /summary_search/: an OpenAI-compatible /embeddings endpoint + model; both blank
# = the built-in hashed bag-of-words embedder (lexical matching, no key).
# LLM_EMBEDDING_API_BASE: https://api.openai.com/v1
# LLM_EMBEDDING_MODEL: text-embedding-3-small
SUMMARY_MAX_COMMENTS: 15
SUMMARY_PROMPT_MAX_CHARS: 12000
SUMMARY_RUN_STALE_MINUTES: 30
# Human edits: False = every user who can see the transient; True = staff / can_edit_summary only
SUMMARY_EDIT_STAFF_ONLY: False
SUMMARY_SEARCH_LIMIT: 25
# embedding (cosine over stored vectors) or text (summary contains the words)
SUMMARY_SEARCH_MODE: embedding
# Matches with a cosine similarity below this are not listed
SUMMARY_SEARCH_MIN_SCORE: 0.1
# Nightly batch: queue a summariser run for transients with new public comments, spectra or
# follow-ups in the last SUMMARY_BATCH_HOURS (at most SUMMARY_BATCH_MAX per pass); off by default
SUMMARY_BATCH_CRON_ENABLED: False
SUMMARY_BATCH_CRON_MINUTES: 1440
SUMMARY_BATCH_HOURS: 24
SUMMARY_BATCH_MAX: 200
