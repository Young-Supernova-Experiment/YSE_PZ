name: Promotion guard

# Only `experimental` may merge into `develop`, and only `develop` into `master`.
# Exceptions into `develop` only: same-repo `dependabot/*` branches, and (#631) a
# `develop-direct/*` branch from this repository (merged by Ryan; develop is then
# merged back into experimental at once). Neither may ever target `master`.
# This job fails for any other pull request into those two branches. Make it a
# required status check ("promotion guard") on the develop and master branch
# protection rules so the Merge button greys out; see docs/branching.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop, master]

permissions:
  contents: read

jobs:
  guard:
    name: promotion guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check that the head branch is allowed to merge into the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "PR: ${HEAD_REPO}:${HEAD} -> ${BASE_REPO}:${BASE}"
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into '$BASE' must come from a branch in $BASE_REPO, not a fork ($HEAD_REPO)."
            exit 1
          fi
          case "$BASE" in
            develop)
              case "$HEAD" in
                experimental|dependabot/*) ;;
                develop-direct/*)
                  echo "OK: '$HEAD' is a develop-direct branch; Ryan merges it, then develop is merged back into experimental (docs/branching.md)."
                  exit 0
                  ;;
                *)
                echo "::error::Only 'experimental' (or a Dependabot or develop-direct branch) may be merged into 'develop' (this PR is from '$HEAD'). Merge your branch into 'experimental' first, then open experimental -> develop."
                exit 1
                ;;
              esac
              ;;
            master)
              if [ "$HEAD" != "develop" ]; then
                echo "::error::Only 'develop' may be merged into 'master' (this PR is from '$HEAD'). Promote through experimental -> develop -> master."
                exit 1
              fi
              ;;
            *)
              echo "Base branch '$BASE' is not guarded."
              ;;
          esac
          echo "OK: '$HEAD' -> '$BASE' is an allowed promotion."
