name: CI

on:
  push:
    branches: [master, develop, experimental]
  pull_request:
    branches: [master, develop, experimental]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff

      - name: Undefined names, redefinitions, literal comparisons, duplicate dict keys
        run: |
          ruff check --select F821,F811,F632,F601 \
            --exclude YSE_App/static,YSE_App/migrations,docker/web_image_history,YSE_App/util,YSE_App/common/getGWevents.py \
            .

  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure application settings
        run: cp YSE_PZ/public_settings.ini YSE_PZ/settings.ini

      - name: Python syntax check (app code)
        run: |
          find YSE_App YSE_PZ -name '*.py' \
            ! -path '*/static/*' ! -path '*/bower_components/*' \
            -exec python3 -m py_compile {} +

      - name: Write docker compose environment
        working-directory: docker
        run: |
          # throwaway per-run test credentials; nothing here is a real secret
          DB_PWD="$(openssl rand -hex 16)"
          printf '%s\n' \
            "VOL=${{ github.workspace }}" \
            "VOL_DB=${{ github.workspace }}/database" \
            "VOL_GHOST=${{ github.workspace }}/ghost_logs" \
            "STATIC_VOL=${{ github.workspace }}/YSE_PZ/static" \
            "DB_PWD=$DB_PWD" \
            "YSE_DATABASE_PASSWORD=$(openssl rand -hex 16)" \
            "YSE_EXPLORER_PASSWORD=$(openssl rand -hex 16)" \
            "LOCAL_DB_PORT=53306" \
            "LOCAL_HTTP_PORT=8080" \
            "DJANGO_SUPERUSER_USERNAME=ci_admin" \
            "DJANGO_SUPERUSER_PASSWORD=$(openssl rand -hex 16)" \
            "DJANGO_SUPERUSER_EMAIL=ci@example.com" \
            "YSE_IS_DEBUG=1" \
            "YSE_LOGIN_LOCKOUT=1" \
            > .env
          echo "::add-mask::$DB_PWD"
          echo "DB_PWD=$DB_PWD" >> "$GITHUB_ENV"
          grep -q '^VOL=' .env
          ! grep -q '^[[:space:]]' .env
          # compose env_file lists .env.secrets (gitignored locally); CI needs an empty stub
          cp .env.secrets.example .env.secrets
          grep -q '^TNS_API_KEY=' .env.secrets

      - name: Start database and web services
        working-directory: docker
        run: |
          docker compose up -d yse_db web || {
            docker logs ysepz_db_container 2>&1 || true
            exit 1
          }

      # The pulled GHCR image bakes in Django 4.0; the stacks run the 4.2 LTS line
      # (requirements.txt and docker/requirements.web.dev pin it, with the asgiref
      # it needs). Install the same pins into the running container and restart it
      # so every check below runs on the Django the stacks run. Drop this step once
      # the image is rebuilt on docker/requirements.web.dev.
      - name: Pin Django 4.2 in the web container
        working-directory: docker
        run: |
          # asgiref first: 3.8.1 also runs the image's Django 4.0, while Django 4.2 on
          # the image's asgiref 3.4.1 cannot import. gunicorn in the container may boot
          # a worker between the two installs; in the other order that worker fails,
          # gunicorn exits and the container (and this pip) is killed (exit 137).
          docker exec ysepz_web_container pip3 install --quiet --no-deps "$(grep -m1 '^asgiref==' ../requirements.txt)"
          # Every Django add-on at its requirements.txt pin, also before Django: the
          # image's older add-ons (django-el-pagination 3.3, django-cron 0.5) cannot
          # import on Django 4.x, while the pinned ones also run the image's 4.0. Without
          # this CI tested the image's add-ons, not the ones the stacks install (#781).
          ADDONS=$(grep -E '^(django-[A-Za-z0-9-]+|djangorestframework)==' ../requirements.txt)
          echo "$ADDONS"
          docker exec ysepz_web_container pip3 install --quiet --no-deps $ADDONS
          docker exec ysepz_web_container pip3 install --quiet --no-deps "$(grep -m1 '^Django==' ../requirements.txt)"
          # Two-factor sign-in for staff (#512; requirements.txt pins), tested in its own step below.
          docker exec ysepz_web_container pip3 install --quiet --no-deps \
            $(grep -E -m2 '^(django-otp|segno)==' ../requirements.txt)
          # Pins bumped in #539 that are newer than the image: install the exact
          # requirements.txt pins (gunicorn: docker/requirements.web.lock) so the
          # suite runs on them.
          PINS=$(for p in Pillow cryptography urllib3 certifi djangorestframework sqlparse lxml Jinja2 MarkupSafe tornado Werkzeug; do
                   grep -i -m1 "^$p==" ../requirements.txt || { echo "::error::no $p pin in requirements.txt" >&2; exit 1; }
                 done)
          PINS="$PINS $(grep -m1 '^gunicorn==' requirements.web.lock)"
          # AstroScheduler's solver (#653): not in the image yet; its own deps are already pinned.
          docker exec ysepz_web_container pip3 install --quiet --no-deps "$(grep -m1 '^astroscheduler ' ../requirements.txt)"
          # SQL Explorer query scope (#723): sqlglot, pure Python with no dependencies; not in the image yet.
          docker exec ysepz_web_container pip3 install --quiet --no-deps "$(grep -m1 '^sqlglot==' ../requirements.txt)"
          echo "$PINS"
          docker exec ysepz_web_container pip3 install --quiet --no-deps $PINS
          docker compose restart web
          # axes' own tables in the CI database (the runbook's `migrate axes` step).
          docker exec ysepz_web_container python3 manage.py migrate axes --noinput
          docker exec ysepz_web_container python3 -c 'import django, sys; v = django.get_version(); print("Django", v); sys.exit(0 if v.startswith("4.2.") else 1)'

      - name: Web container logs (on failure)
        if: failure()
        working-directory: docker
        run: |
          docker compose ps -a || true
          docker compose logs --tail=300 web || true

      - name: Wait for MySQL
        working-directory: docker
        run: |
          for i in $(seq 1 60); do
            if timeout 15 docker exec ysepz_db_container mysqladmin ping -h localhost -p"$DB_PWD" --silent; then
              echo "MySQL ready after attempt $i"
              exit 0
            fi
            echo "Attempt $i/60: MySQL not ready yet"
            sleep 5
          done
          echo "MySQL did not become ready in time"
          docker compose ps || true
          docker compose logs --tail=200 yse_db || true
          exit 1

      - name: Wait for Gunicorn
        working-directory: docker
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 5 --max-time 10 http://localhost:8000/login/ >/dev/null; then
              echo "Gunicorn ready after attempt $i"
              exit 0
            fi
            echo "Attempt $i/60: login not ready yet"
            timeout 20 docker logs ysepz_web_container 2>&1 | tail -40 || true
            sleep 5
          done
          echo "Web service did not become ready in time"
          docker compose ps || true
          docker compose logs --tail=200 web || true
          docker compose logs --tail=100 yse_db || true
          exit 1

      - name: Django system check
        run: docker exec ysepz_web_container python3 manage.py check

      - name: Run tests
        run: docker exec ysepz_web_container python3 manage.py test YSE_App.tests --verbosity=2

      # Models and migrations agree on this Django (a missing migration would make
      # the deploy's migrate step and the models disagree on the stacks). Runs even
      # when tests fail; -v 3 prints the migration it would write.
      - name: No missing YSE_App migrations
        if: always()
        run: docker exec ysepz_web_container python3 manage.py makemigrations YSE_App --check --dry-run -v 3

      # The suite above runs with two-factor sign-in off (the default). Its flow
      # tests need django-otp's tables in the test database, so run that module
      # again with the flag on (YSE_App/tests/test_staff_mfa.py).
      - name: Staff two-factor sign-in tests (flag on)
        run: |
          docker exec -e YSE_STAFF_MFA_REQUIRED=1 ysepz_web_container python3 manage.py check
          docker exec -e YSE_STAFF_MFA_REQUIRED=1 ysepz_web_container python3 manage.py test YSE_App.tests.test_staff_mfa --verbosity=2

      - name: Page load regression and benchmark plots
        run: |
          docker exec ysepz_web_container python3 manage.py test YSE_App.tests.test_page_load_regression -v2
          # Non-gating trend record. The command caps its own saved-query benchmark
          # (--mag-limited-max-seconds, default 600 s) and records what it has; the
          # outer timeout is a last resort so this step can never hang the job.
          timeout -k 30s 20m docker exec ysepz_web_container python3 manage.py record_perf_benchmark --label "ci-${{ github.sha }}" \
            || echo "::warning::record_perf_benchmark exited $? (timed out or failed); perf history not updated for this run"

      - name: Upload perf metrics artifacts
        if: always()
        # Advisory: the perf artifact is a convenience for trend inspection. A
        # transient GitHub ArtifactService timeout must not turn a passing
        # docker-test red after all tests and benchmarks have succeeded.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yse-perf-metrics
          path: |
            YSE_App/static/YSE_App/perf/metrics_history.json
            YSE_App/static/YSE_App/perf/*.png
          if-no-files-found: ignore

      - name: Tear down and prune Docker artifacts
        if: always()
        working-directory: docker
        run: |
          docker compose down -v
          bash -n scripts/prune-yse-docker.sh
          bash scripts/prune-yse-docker.sh aggressive
