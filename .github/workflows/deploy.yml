name: Deploy Experimental Stack

on:
  push:
    branches:
      - experimental  # Triggers when code is pushed to the experimental branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Ziggy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to experimental folder
            cd /data/yse_pz/YSE_PZ_experimental
            
            # 2. Pull fresh code from github
            git fetch origin
            git reset --hard origin/experimental
            
            # 3. Synchronize core requirements (skipping build isolation for extinction)
            ./venv/bin/pip install wheel
            ./venv/bin/pip install --no-build-isolation "extinction==0.4.2"
            ./venv/bin/pip install "sncosmo==2.8.0" "urllib3<1.27" "django>=3.2,<4.0"
            ./venv/bin/pip install --use-deprecated=legacy-resolver -r requirements.txt
            
            # 4. Run database migrations safely
            ./venv/bin/python manage.py migrate --noinput
            
            # 5. Reload the server environment
            sudo systemctl restart apache2
