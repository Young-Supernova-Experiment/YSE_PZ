name: Deploy Stack

on:
  push:
    branches:
      - experimental
      - develop
  pull_request:
    branches:
      - experimental
      - develop
    types:
      - closed

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    # Self-hosted Ziggy runner
    runs-on: self-hosted

    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          case "$BRANCH" in
            experimental)
              echo "dir=/data/yse_pz/YSE_PZ_experimental" >> "$GITHUB_OUTPUT"
              echo "branch=experimental" >> "$GITHUB_OUTPUT"
              # Matches yse-experimental.conf WSGIDaemonProcess python-home
              echo "python=/data/yse_pz/YSE_PZ_experimental/venv/bin/python" >> "$GITHUB_OUTPUT"
              # Project venv is writable by the runner — refresh deps each deploy
              echo "install_deps=true" >> "$GITHUB_OUTPUT"
              echo "smoke_url=https://ziggy.ucolick.org/yse_experimental/login/" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "dir=/data/yse_pz/YSE_PZ_test" >> "$GITHUB_OUTPUT"
              echo "branch=develop" >> "$GITHUB_OUTPUT"
              # Matches yse-test.conf WSGIDaemonProcess python-home
              echo "python=/data/yse_pz/yse_test_virtual/bin/python" >> "$GITHUB_OUTPUT"
              # Shared env is not writable by the runner; passwordless sudo is
              # only available for systemctl (not pip). Keep deps ops-managed.
              echo "install_deps=false" >> "$GITHUB_OUTPUT"
              echo "smoke_url=https://ziggy.ucolick.org/yse_test/login/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deploy branch: $BRANCH" >&2
              exit 1
              ;;
          esac
          echo "Deploying branch=$BRANCH"

      - name: Deploy Application
        run: |
          cd "${{ steps.target.outputs.dir }}"
          # A person may have run git in this checkout by hand, leaving it owned
          # by another Unix user; git then refuses to touch it. Trust this path
          # and log both users so a permissions failure below is easy to read.
          echo "runner user: $(id -un); checkout owner: $(stat -c %U .)"
          git config --global --add safe.directory "$PWD"
          PYTHON="${{ steps.target.outputs.python }}"

          git fetch origin
          git reset --hard "origin/${{ steps.target.outputs.branch }}"

          if [ "${{ steps.target.outputs.install_deps }}" = "true" ]; then
            "$PYTHON" -m pip install wheel
            # extinction is an sdist whose setup.py imports numpy, so it cannot
            # build inside pip's isolated build env; install it first.
            "$PYTHON" -m pip install --no-build-isolation "extinction==0.4.2"
            # The web venv gets only the web/app runtime set. requirements.txt is
            # resolver-consistent since the web/ingest split (#186), so no
            # --no-deps: pip checks the pins against each other. Django stays on
            # 3.2 (Django>=3.2,<4.0 in the file) until #133 is scheduled.
            "$PYTHON" -m pip install -r requirements.txt
            # The ML extras (requirements-ingest.txt: RAPID/TCN, TF-addons) are
            # NOT installed here. To set up a cron / analysis environment with
            # them, run with that environment's interpreter (by hand or from its
            # own job):
            #   <cron-venv>/bin/python -m pip install --no-build-isolation "extinction==0.4.2"
            #   <cron-venv>/bin/python -m pip install -r requirements-ingest.txt
          else
            echo "Skipping pip install (shared interpreter; not writable by runner)"
          fi

          # Fail here, before touching the DB or restarting Apache, if the
          # freshly checked-out code does not even import / configure.
          "$PYTHON" manage.py check

          "$PYTHON" manage.py migrate --noinput --skip-checks

          # Writes into this stack's STATIC_ROOT. Apache must Alias that URL
          # (prod: /static/, test: /test_static/, experimental: /experimental_static/).
          "$PYTHON" manage.py collectstatic --noinput

          sudo systemctl restart apache2

      - name: Smoke test login page
        run: |
          URL="${{ steps.target.outputs.smoke_url }}"
          echo "Smoke-testing $URL"
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$URL"
